name: CI
on:
  pull_request:
  push:
    branches: [dev]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter client build
